[project]
name = "ru-yt-translator-backend"
version = "0.1.0"
description = "Backend for live-voice translation of YouTube videos (Whisper + XTTS-v2)."
readme = "README.md"
requires-python = ">=3.10,<3.12"

dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",

  # ASR / TTS / translate
  "faster-whisper>=1.0.3",
  # XTTS-v2 ships under the legacy "TTS" package (Coqui).  The package is no
  # longer maintained on PyPI; we pin to the last known good version.
  "TTS==0.22.0",
  # XTTS hard-deps that pip sometimes resolves to a too-new version
  "torch>=2.1,<2.4",
  "torchaudio>=2.1,<2.4",
  "numpy<2.0",

  # video / audio I/O
  "yt-dlp>=2024.8.6",
  "soundfile>=0.12",
  "pydub>=0.25.1",

  # misc
  "httpx>=0.27",
  "tenacity>=9.0",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",  # line too long; we still want long error messages
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
