<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Настройки переводчика</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>YouTube → Русский</h1>
      <p class="subtitle">Озвучка видео на русском языке</p>
    </header>

    <main>
      <section>
        <label>Движок голоса</label>
        <div class="engine-toggle">
          <label class="inline">
            <input type="radio" name="tts-engine" value="browser" />
            <span>Браузер (быстро, системный голос)</span>
          </label>
          <label class="inline">
            <input type="radio" name="tts-engine" value="piper" />
            <span>Piper (нейро-голоса, офлайн)</span>
          </label>
          <label class="inline">
            <input type="radio" name="tts-engine" value="backend" />
            <span>Бэкенд (живые голоса, клонирование тембра)</span>
          </label>
        </div>
        <p class="muted" id="engine-hint"></p>
      </section>

      <section id="piper-section" hidden>
        <label for="piper-voice">Голос Piper</label>
        <select id="piper-voice">
          <option value="ru_RU-ruslan-medium">Ruslan — мужской, бас</option>
          <option value="ru_RU-irina-medium">Irina — женский</option>
          <option value="ru_RU-denis-medium">Denis — мужской</option>
          <option value="ru_RU-dmitri-medium">Dmitri — мужской, тенор</option>
        </select>
        <p class="muted">
          Каждый голос — отдельный файл ~60 МБ. Скачивается с HuggingFace
          при первом включении и кешируется офлайн.
        </p>
      </section>

      <section id="backend-section" hidden>
        <label for="backend-url">URL бэкенда</label>
        <input
          type="url"
          id="backend-url"
          placeholder="https://ru-yt-translator.fly.dev"
          autocomplete="off"
        />
        <p class="muted" id="backend-status"></p>
      </section>

      <section>
        <label for="voice">Русский голос</label>
        <select id="voice"></select>
        <button id="test-voice" type="button" class="secondary">Проверить голос</button>
      </section>

      <section>
        <label for="rate">Скорость <span class="value" id="rate-value">1.05×</span></label>
        <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1.05" />
      </section>

      <section>
        <label for="volume">Громкость <span class="value" id="volume-value">100%</span></label>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1" />
      </section>

      <section>
        <label for="pitch">Тон <span class="value" id="pitch-value">1.00</span></label>
        <input type="range" id="pitch" min="0.5" max="2" step="0.05" value="1" />
      </section>

      <section class="row">
        <label for="auto-mute" class="inline">
          <input type="checkbox" id="auto-mute" checked />
          <span>Заглушать оригинал автоматически</span>
        </label>
      </section>

      <section>
        <button id="save" type="button" class="primary">Сохранить</button>
      </section>

      <section class="hint">
        <p>
          Зайди на любое видео <a href="https://www.youtube.com" target="_blank">YouTube</a>
          и нажми кнопку «🎙 Перевести» рядом с лайками.
        </p>
        <p class="muted">Работает на видео с субтитрами (включая автоматические).</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
